<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VocaPulse Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0c10">
    <style>
        :root {
            --bg: #0d0e15;
            --card: #181926;
            --border: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
            --text-sub: #94a3b8;
            --accent: #ff3366;
            --green: #2ed573;
            --yellow: #ff9f1c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; user-select: none; }
        body { background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

        /* Header */
        header { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; background: rgba(24, 25, 38, 0.8); backdrop-filter: blur(10px); }
        .logo { font-weight: 900; font-size: 1.2rem; color: var(--accent); }
        .stats { display: flex; gap: 10px; font-weight: 700; font-size: 0.85rem; }

        /* Main Screen Container */
        main { flex: 1; display: flex; flex-direction: column; padding: 12px; overflow: hidden; position: relative; }
        .view { display: none; flex-direction: column; height: 100%; justify-content: space-between; }
        .view.active { display: flex; }

        /* Language Switcher */
        .lang-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; flex-shrink: 0; }
        .lang-btn { padding: 6px 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 12px; color: var(--text-sub); font-size: 0.8rem; font-weight: 700; white-space: nowrap; cursor: pointer; }
        .lang-btn.active { background: var(--text); color: var(--bg); }

        /* Mode Filter */
        .mode-bar { display: flex; background: rgba(255,255,255,0.05); border-radius: 10px; padding: 2px; margin-bottom: 8px; flex-shrink: 0; }
        .mode-btn { flex: 1; text-align: center; padding: 6px; font-size: 0.8rem; font-weight: 700; color: var(--text-sub); border-radius: 8px; cursor: pointer; }
        .mode-btn.active { background: rgba(255,255,255,0.15); color: #fff; }

        /* Card Container - Perfectly Scaled */
        .card-stage { flex: 1; display: flex; align-items: center; justify-content: center; perspective: 1000px; margin: 8px 0; min-height: 0; }
        .card { width: 100%; max-width: 360px; height: 100%; max-height: 380px; position: relative; transform-style: preserve-3d; transition: transform 0.5s; cursor: pointer; }
        .card.flipped { transform: rotateY(180deg); }

        .face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 20px; background: var(--card); border: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; justify-content: space-between; text-align: center; }
        .face.back { transform: rotateY(180deg); background: #131522; }

        .tag { align-self: flex-start; font-size: 0.7rem; font-weight: 800; padding: 3px 8px; border-radius: 6px; background: rgba(255,51,102,0.2); color: var(--accent); }
        .word { font-size: 2rem; font-weight: 800; margin-top: 10px; }
        .script { font-size: 0.95rem; color: var(--accent); font-weight: 600; }
        .ipa { font-size: 0.85rem; color: var(--text-sub); font-family: monospace; }
        .trans { font-size: 1.5rem; font-weight: 700; color: var(--green); }
        .syn { font-size: 0.8rem; color: var(--text-sub); }
        .ex { font-size: 0.8rem; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 8px; text-align: left; margin-top: 8px; }

        .speaker { position: absolute; top: 18px; right: 18px; background: rgba(255,255,255,0.1); border: none; color: #fff; border-radius: 50%; width: 36px; height: 36px; font-size: 1rem; cursor: pointer; }

        /* Action Buttons */
        .actions { display: flex; gap: 10px; flex-shrink: 0; }
        .btn { flex: 1; padding: 14px; border: none; border-radius: 14px; font-weight: 800; font-size: 0.95rem; cursor: pointer; }
        .btn-again { background: rgba(255,51,102,0.2); color: var(--accent); border: 1px solid var(--accent); }
        .btn-pass { background: var(--green); color: #000; }

        /* Grammar List */
        .grammar-list { overflow-y: auto; display: flex; flex-direction: column; gap: 10px; height: 100%; }
        .g-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
        .g-title { font-weight: 800; color: var(--yellow); margin-bottom: 6px; }
        .g-rule { font-size: 0.85rem; color: #ccc; line-height: 1.4; }

        /* Quiz Options */
        .quiz-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; flex-shrink: 0; }
        .q-btn { background: rgba(255,255,255,0.08); border: 1px solid var(--border); color: #fff; padding: 14px; border-radius: 12px; font-weight: 700; text-align: center; font-size: 0.85rem; cursor: pointer; }

        /* Bottom Nav */
        nav { height: 60px; background: #08090d; border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; flex-shrink: 0; }
        .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text-sub); font-size: 0.7rem; font-weight: 700; cursor: pointer; width: 25%; }
        .nav-btn.active { color: var(--accent); }
        .nav-btn span:first-child { font-size: 1.2rem; }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ VOCAPULSE</div>
        <div class="stats">
            <div>🔥 <span id="st-streak">1</span></div>
            <div>💎 <span id="st-xp">0</span> XP</div>
        </div>
    </header>

    <main>
        <!-- TAB 1: VOKABELN & QUIZ -->
        <div id="view-vocab" class="view active">
            <div class="lang-bar" id="lang-bar"></div>
            
            <div class="mode-bar">
                <div class="mode-btn active" onclick="setMode('cards')">Karteikarten</div>
                <div class="mode-btn" onclick="setMode('quiz')">Blitz-Quiz</div>
            </div>

            <!-- CARDS MODE -->
            <div id="cards-mode" style="height:100%; display:flex; flex-direction:column; justify-content:space-between;">
                <div class="card-stage">
                    <div class="card" id="main-card" onclick="this.classList.toggle('flipped')">
                        <div class="face front">
                            <span class="tag" id="c-level">A1</span>
                            <button class="speaker" onclick="speak(event)">🔊</button>
                            <div>
                                <div class="word" id="c-word">...</div>
                                <div class="script" id="c-script"></div>
                                <div class="ipa" id="c-ipa"></div>
                            </div>
                            <div style="font-size: 0.7rem; color: var(--text-sub);">Tippen zum Drehen ↺</div>
                        </div>
                        <div class="face back">
                            <span class="tag" style="background:rgba(46,213,115,0.2); color:var(--green);">Bedeutung</span>
                            <div>
                                <div class="trans" id="c-trans">...</div>
                                <div class="syn" id="c-syn"></div>
                            </div>
                            <div class="ex" id="c-ex"></div>
                            <div style="font-size: 0.7rem; color: var(--text-sub);">Tippen zum Drehen ↺</div>
                        </div>
                    </div>
                </div>
                <div class="actions">
                    <button class="btn btn-again" onclick="answer(false)">Nochmal</button>
                    <button class="btn btn-pass" onclick="answer(true)">Gelernt (+10 XP)</button>
                </div>
            </div>

            <!-- QUIZ MODE -->
            <div id="quiz-mode" style="height:100%; display:none; flex-direction:column; justify-content:space-between;">
                <div style="background:var(--card); border:1px solid var(--border); border-radius:20px; padding:20px; text-align:center; margin-auto:0;">
                    <span class="tag" id="q-level">A1</span>
                    <div class="word" id="q-word" style="margin:15px 0 5px;">...</div>
                    <div class="script" id="q-script"></div>
                </div>
                <div class="quiz-grid" id="q-options"></div>
            </div>
        </div>

        <!-- TAB 2: GRAMMATIK -->
        <div id="view-grammar" class="view">
            <div class="lang-bar" id="grammar-lang-bar"></div>
            <div class="grammar-list" id="grammar-container"></div>
        </div>

        <!-- TAB 3: DOJO -->
        <div id="view-dojo" class="view">
            <div style="text-align:center; padding:10px; background:rgba(255,51,102,0.1); border:1px solid var(--accent); border-radius:12px; margin-bottom:10px;">
                <div style="font-weight:800; color:var(--accent);">🥷 DEIN DOJO</div>
                <div style="font-size:0.75rem; color:var(--text-sub);">Fehler landen automatisch hier.</div>
            </div>
            <div id="dojo-stage" style="flex:1; display:flex; flex-direction:column; justify-content:space-between;">
                <div class="card-stage">
                    <div class="card" id="dojo-card" onclick="this.classList.toggle('flipped')">
                        <div class="face front">
                            <span class="tag">DOJO</span>
                            <button class="speaker" onclick="speakDojo(event)">🔊</button>
                            <div>
                                <div class="word" id="d-word">...</div>
                                <div class="script" id="d-script"></div>
                            </div>
                            <div style="font-size:0.7rem; color:var(--text-sub);">Tippen zum Drehen</div>
                        </div>
                        <div class="face back">
                            <div class="trans" id="d-trans">...</div>
                        </div>
                    </div>
                </div>
                <div class="actions">
                    <button class="btn btn-again" onclick="answerDojo(false)">Noch nicht</button>
                    <button class="btn btn-pass" onclick="answerDojo(true)">Gemeistert</button>
                </div>
            </div>
        </div>

        <!-- TAB 4: PROFIL -->
        <div id="view-profile" class="view" style="justify-content:flex-start; gap:15px;">
            <h3 style="text-align:center;">Dein Fortschritt</h3>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <div style="background:var(--card); padding:15px; border-radius:12px; text-align:center; border:1px solid var(--border);">
                    <div style="font-size:1.5rem; font-weight:800; color:var(--green);" id="p-learned">0</div>
                    <div style="font-size:0.75rem; color:var(--text-sub);">Gelernt</div>
                </div>
                <div style="background:var(--card); padding:15px; border-radius:12px; text-align:center; border:1px solid var(--border);">
                    <div style="font-size:1.5rem; font-weight:800; color:var(--accent);" id="p-dojo">0</div>
                    <div style="font-size:0.75rem; color:var(--text-sub);">Im Dojo</div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav>
        <div class="nav-btn active" onclick="nav('vocab')"><span>🎴</span><span>Vokabeln</span></div>
        <div class="nav-btn" onclick="nav('grammar')"><span>📖</span><span>Grammatik</span></div>
        <div class="nav-btn" onclick="nav('dojo')"><span>🥷</span><span>Dojo</span></div>
        <div class="nav-btn" onclick="nav('profile')"><span>📊</span><span>Profil</span></div>
    </nav>

    <script>
        // DATENBANK (JA, ES, EN, FR, IT, PT)
        const DB = {
            ja: [
                { w: "水", s: "みず (Mizu)", ipa: "/mizu/", l: "A1", t: "Wasser", ex: "水を飲みます (Ich trinke Wasser)" },
                { w: "食べる", s: "たべる (Taberu)", ipa: "/taberu/", l: "A1", t: "essen", ex: "ご飯を食べる (Reis essen)" },
                { w: "素晴らしい", s: "すばらしい", ipa: "/subarashii/", l: "A2", t: "wunderbar / großartig", ex: "素晴らしい日 (Ein wunderbarer Tag)" }
            ],
            es: [
                { w: "Agua", s: "Substantiv (f)", ipa: "/ˈaɡwa/", l: "A1", t: "Wasser", ex: "Un vaso de agua, por favor." },
                { w: "Comer", s: "Verb", ipa: "/koˈmeɾ/", l: "A1", t: "essen / speisen", ex: "Vamos a comer." }
            ],
            en: [
                { w: "Water", s: "Noun", ipa: "/ˈwɔːtər/", l: "A1", t: "Wasser", ex: "Drink more water." },
                { w: "Ubiquitous", s: "Adjective", ipa: "/juːˈbɪkwɪtəs/", l: "C1", t: "allgegenwärtig", ex: "Smartphones are ubiquitous." }
            ],
            fr: [
                { w: "Eau", s: "Substantif (f)", ipa: "/o/", l: "A1", t: "Wasser", ex: "L'eau est froide." }
            ],
            it: [
                { w: "Acqua", s: "Sostantivo (f)", ipa: "/ˈakkwa/", l: "A1", t: "Wasser", ex: "Un bicchiere d'acqua." }
            ],
            pt: [
                { w: "Água", s: "Substantivo (f)", ipa: "/ˈaɡwɐ/", l: "A1", t: "Wasser", ex: "Preciso de água." }
            ]
        };

        const GRAMMAR = {
            ja: [{ t: "Partikel は (wa)", r: "Markiert das Thema des Satzes." }],
            es: [{ t: "Ser vs. Estar", r: "Ser = dauerhaft, Estar = vorübergehender Zustand." }],
            en: [{ t: "Present Perfect", r: "Vergangenheit mit Bezug zur Gegenwart." }],
            fr: [{ t: "Passé Composé", r: "Wird mit Avoir oder Être gebildet." }],
            it: [{ t: "Congiuntivo", r: "Drückt Gefühle und Zweifel aus." }],
            pt: [{ t: "Por vs Para", r: "Por = Grund, Para = Ziel/Empfänger." }]
        };

        const LANGS = [
            { c: 'ja', n: '🇯🇵 Japanisch', tts: 'ja-JP' },
            { c: 'es', n: '🇪🇸 Spanisch', tts: 'es-ES' },
            { c: 'en', n: '🇬🇧 Englisch', tts: 'en-US' },
            { c: 'fr', n: '🇫🇷 Französisch', tts: 'fr-FR' },
            { c: 'it', n: '🇮🇹 Italienisch', tts: 'it-IT' },
            { c: 'pt', n: '🇵🇹 Portugiesisch', tts: 'pt-PT' }
        ];

        let curLang = 'ja';
        let idx = 0;
        let mode = 'cards';
        let xp = parseInt(localStorage.getItem('vp_xp') || '0');
        let learned = parseInt(localStorage.getItem('vp_learned') || '0');
        let dojo = JSON.parse(localStorage.getItem('vp_dojo') || '[]');

        function init() {
            renderLangs();
            loadCard();
            renderGrammar();
            updateUI();
            if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
        }

        function renderLangs() {
            ['lang-bar', 'grammar-lang-bar'].forEach(id => {
                const el = document.getElementById(id);
                el.innerHTML = '';
                LANGS.forEach(l => {
                    const btn = document.createElement('div');
                    btn.className = `lang-btn ${l.c === curLang ? 'active' : ''}`;
                    btn.innerText = l.n;
                    btn.onclick = () => { curLang = l.c; idx = 0; renderLangs(); loadCard(); renderGrammar(); };
                    el.appendChild(btn);
                });
            });
        }

        function loadCard() {
            const list = DB[curLang] || [];
            if (!list.length) return;
            const item = list[idx % list.length];
            
            document.getElementById('main-card').classList.remove('flipped');
            document.getElementById('c-word').innerText = item.w;
            document.getElementById('c-script').innerText = item.s || '';
            document.getElementById('c-ipa').innerText = item.ipa || '';
            document.getElementById('c-level').innerText = item.l;
            document.getElementById('c-trans').innerText = item.t;
            document.getElementById('c-ex').innerText = item.ex || '';

            if (mode === 'quiz') setupQuiz(item, list);
        }

        function answer(pass) {
            const list = DB[curLang];
            const item = list[idx % list.length];
            if (pass) {
                xp += 10;
                learned++;
            } else {
                if (!dojo.some(x => x.w === item.w)) dojo.push(item);
            }
            save();
            idx++;
            setTimeout(loadCard, 100);
        }

        function setMode(m) {
            mode = m;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('cards-mode').style.display = m === 'cards' ? 'flex' : 'none';
            document.getElementById('quiz-mode').style.display = m === 'quiz' ? 'flex' : 'none';
            loadCard();
        }

        function setupQuiz(item, list) {
            document.getElementById('q-word').innerText = item.w;
            document.getElementById('q-script').innerText = item.s || '';
            document.getElementById('q-level').innerText = item.l;
            
            const grid = document.getElementById('q-options');
            grid.innerHTML = '';
            
            let opts = [item.t];
            let others = list.map(x => x.t).filter(x => x !== item.t);
            while (opts.length < 4 && others.length > 0) opts.push(others.splice(Math.floor(Math.random() * others.length), 1)[0]);
            opts.sort(() => Math.random() - 0.5);

            opts.forEach(o => {
                const b = document.createElement('div');
                b.className = 'q-btn';
                b.innerText = o;
                b.onclick = () => {
                    if (o === item.t) { xp += 15; learned++; }
                    else { if (!dojo.some(x => x.w === item.w)) dojo.push(item); }
                    save(); idx++; loadCard();
                };
                grid.appendChild(b);
            });
        }

        function renderGrammar() {
            const container = document.getElementById('grammar-container');
            container.innerHTML = '';
            (GRAMMAR[curLang] || []).forEach(g => {
                container.innerHTML += `<div class="g-card"><div class="g-title">${g.t}</div><div class="g-rule">${g.r}</div></div>`;
            });
        }

        function loadDojo() {
            const stage = document.getElementById('dojo-stage');
            if (!dojo.length) {
                stage.innerHTML = '<div style="text-align:center; margin:auto; color:var(--text-sub);">🎉 Dein Dojo ist zurzeit leer!</div>';
                return;
            }
            const item = dojo[0];
            document.getElementById('d-word').innerText = item.w;
            document.getElementById('d-script').innerText = item.s || '';
            document.getElementById('d-trans').innerText = item.t;
        }

        function answerDojo(pass) {
            if (!dojo.length) return;
            if (pass) { dojo.shift(); xp += 20; }
            else { dojo.push(dojo.shift()); }
            save(); loadDojo();
        }

        function speak(e) {
            e.stopPropagation();
            const item = DB[curLang][idx % DB[curLang].length];
            const u = new SpeechSynthesisUtterance(item.w);
            u.lang = LANGS.find(l => l.c === curLang).tts;
            window.speechSynthesis.speak(u);
        }

        function speakDojo(e) {
            e.stopPropagation();
            if(!dojo.length) return;
            const u = new SpeechSynthesisUtterance(dojo[0].w);
            u.lang = LANGS.find(l => l.c === curLang).tts;
            window.speechSynthesis.speak(u);
        }

        function nav(target) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`view-${target}`).classList.add('active');
            event.currentTarget.classList.add('active');
            if (target === 'dojo') loadDojo();
        }

        function save() {
            localStorage.setItem('vp_xp', xp);
            localStorage.setItem('vp_learned', learned);
            localStorage.setItem('vp_dojo', JSON.stringify(dojo));
            updateUI();
        }

        function updateUI() {
            document.getElementById('st-xp').innerText = xp;
            document.getElementById('p-learned').innerText = learned;
            document.getElementById('p-dojo').innerText = dojo.length;
        }

        init();
    </script>
</body>
</html>
